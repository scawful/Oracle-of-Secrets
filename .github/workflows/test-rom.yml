name: ROM Tests

on:
  push:
    branches: [master]
  pull_request:
    # Any base branch (stacked PRs). `edited` covers base retargets.
    # No path filter: the jobs take ~25 s, and a filtered workflow cannot be
    # a required check. Do not add an `edited`-only job guard: a skipped
    # check counts as passing.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# Only PR runs share a group (one per PR); push and workflow_dispatch runs get
# a unique group (run_id), so a master push never cancels or replaces a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =============================================================================
  # ASM Syntax Check
  # =============================================================================
  # Validates ASM files compile without errors using Asar
  asm-check:
    name: ASM Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Asar
        run: |
          # The v1.91 release archive contains only asar.exe, so build the
          # Linux CLI from the exact v1.91 source commit.
          ASAR_COMMIT=6a6dbdaed8cb773e583052ce4f66375bd896c3a1
          wget -q "https://github.com/RPGHacker/asar/archive/${ASAR_COMMIT}.tar.gz" -O asar-src.tar.gz
          mkdir asar-src
          tar -xzf asar-src.tar.gz --strip-components=1 -C asar-src
          cmake -S asar-src/src -B asar-build -DCMAKE_BUILD_TYPE=Release
          cmake --build asar-build --config Release --target asar-standalone --parallel 2
          mkdir -p asar
          install -m 755 asar-build/asar/bin/asar asar/asar
          ./asar/asar --version

      - name: Check ASM Syntax
        run: |
          # Create a dummy ROM for syntax checking (Asar needs a file to write to)
          # This only validates syntax, not actual assembly output
          dd if=/dev/zero of=test.sfc bs=1024 count=2048 2>/dev/null

          # Seed the source bytes inspected by guarded patches and the message
          # bank terminator scanned at assembly time.
          printf '\x73\x80\x39' | dd of=test.sfc bs=1 seek=$((0xE9E6)) conv=notrunc 2>/dev/null
          printf '\x7A\x80\x38' | dd of=test.sfc bs=1 seek=$((0xE9F5)) conv=notrunc 2>/dev/null
          printf '\x7F' | dd of=test.sfc bs=1 seek=$((0x773FF)) conv=notrunc 2>/dev/null

          # Minimal coherent data for ROM-reading guards (source assertions unchanged):
          # a one-entry D7 room $A2 sprite list with the big-key drop, and vanilla bytes for
          # tile types $055/$07C, the pit-damage table tail, the item-receipt operand and
          # King Dodongo health. Not real ROM content; real-ROM checks run in build_rom.sh.
          printf '\x00\xC8' | dd of=test.sfc bs=1 seek=$((0x4C298)) conv=notrunc 2>/dev/null  # $09C298 RoomData_SpritePointers operand -> fixture table $09:C800
          printf '\x00\xCA' | dd of=test.sfc bs=1 seek=$((0x4C944)) conv=notrunc 2>/dev/null  # $09C944 room $A2 sprite list -> $09:CA00
          printf '\x00\xFD\x00\xE4\xFF' | dd of=test.sfc bs=1 seek=$((0x4CA00)) conv=notrunc 2>/dev/null  # $09CA00 header, big-key drop $FD,$00,$E4, end $FF
          printf '\x02' | dd of=test.sfc bs=1 seek=$((0x716AE)) conv=notrunc 2>/dev/null  # $0E96AE tile $055 type (vanilla $02)
          printf '\x00' | dd of=test.sfc bs=1 seek=$((0x716D5)) conv=notrunc 2>/dev/null  # $0E96D5 tile $07C type (vanilla $00)
          printf '\x23\x01' | dd of=test.sfc bs=1 seek=$((0x197A)) conv=notrunc 2>/dev/null  # $00997A pit-damage table filler $0123 (vanilla)
          printf '\x23\x01' | dd of=test.sfc bs=1 seek=$((0x197C)) conv=notrunc 2>/dev/null  # $00997C pit-damage table filler $0123 (vanilla)
          printf '\x30\x02' | dd of=test.sfc bs=1 seek=$((0x4863E)) conv=notrunc 2>/dev/null  # $09863E AncillaAdd_ItemReceipt operand $0230 (vanilla)
          printf '\x28' | dd of=test.sfc bs=1 seek=$((0x6B205)) conv=notrunc 2>/dev/null  # $0DB205 King Dodongo health (vanilla $28)

          # Original tag $24 vector and Holes2 body guarded by custom_tag.asm.
          printf '\x89\xCC' | dd of=test.sfc bs=1 seek=$((0xC2C5)) conv=notrunc 2>/dev/null  # $01C2C5 vector -> $01CC89
          printf '\xC2\x30\x20\xCC\xCD\x90\xF6\xA0\x05\x00\x80\xD9' | dd of=test.sfc bs=1 seek=$((0xCC89)) conv=notrunc 2>/dev/null  # $01CC89 RoomTag_Holes2

          # Original desert-statue contact/prep instructions inspected by Garo's guards.
          printf '\x22\x29\xF1\x06' | dd of=test.sfc bs=1 seek=$((0x29573)) conv=notrunc 2>/dev/null  # $059573 JSL $06F129
          printf '\xAD\x6A\x0B\x9D\x90\x0D' | dd of=test.sfc bs=1 seek=$((0x30F4D)) conv=notrunc 2>/dev/null  # $068F4D LDA $0B6A : STA $0D90,X

          # Native NMI joypad call and unused trampoline bytes for Time's note.
          printf '\x20\xE0\x89\x20\xD1\x83' | dd of=test.sfc bs=1 seek=$((0x13E)) conv=notrunc 2>/dev/null
          printf '\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF' | dd of=test.sfc bs=1 seek=$((0x9C2)) conv=notrunc 2>/dev/null

          # Original NMI and bomb draw instructions inspected by Bombchu's guards.
          printf '\xAE\x34\x01\x8E\x16\x21' | dd of=test.sfc bs=1 seek=$((0xB56)) conv=notrunc 2>/dev/null
          printf '\xBD\x10\x9D' | dd of=test.sfc bs=1 seek=$((0x427D7)) conv=notrunc 2>/dev/null
          printf '\xBD\x11\x9D' | dd of=test.sfc bs=1 seek=$((0x427DD)) conv=notrunc 2>/dev/null

          # Original ammunition and pickup instructions guarded by Bombchu supply.
          printf '\xAF\x43\xF3\x7E' | dd of=test.sfc bs=1 seek=$((0x48127)) conv=notrunc 2>/dev/null  # $098127 LDA.l $7EF343
          printf '\x8F\x43\xF3\x7E' | dd of=test.sfc bs=1 seek=$((0x48133)) conv=notrunc 2>/dev/null  # $098133 STA.l $7EF343
          printf '\xBC\x20\x0E\xB9\xF9\xD0' | dd of=test.sfc bs=1 seek=$((0x351D8)) conv=notrunc 2>/dev/null  # $06D1D8 LDY $0E20,X : LDA $D0F9,Y
          printf '\xBC\x20\x0E\xB9\x44\xD1' | dd of=test.sfc bs=1 seek=$((0x35257)) conv=notrunc 2>/dev/null  # $06D257 LDY $0E20,X : LDA $D144,Y

          # Original message-pointer epilogue guarded by the Minish tutorials.
          printf '\xE2\x30\xAB\x6B' | dd of=test.sfc bs=1 seek=$((0x75447)) conv=notrunc 2>/dev/null  # $0ED447 SEP #$30 : PLB : RTL

          # Original room-tag, hidden-chest and statue instructions guarded by
          # Song of Secrets / Elegy of Stone; headerless LoROM PC offsets.
          printf '\xA9\x08\x80\x0E' | dd of=test.sfc bs=1 seek=$((0xCC0C)) conv=notrunc 2>/dev/null  # $01CC0C tag $35 hole handler
          for secrets_tag_a_pc in 0x9905 0x996D 0xBCC2; do
            printf '\xA5\xAE\x29\xFF\x00' | dd of=test.sfc bs=1 seek=$((secrets_tag_a_pc)) conv=notrunc 2>/dev/null  # LDA $AE : AND #$00FF
          done
          for secrets_tag_b_pc in 0x9923 0x998B 0xBCE0; do
            printf '\xA5\xAF\x29\xFF\x00' | dd of=test.sfc bs=1 seek=$((secrets_tag_b_pc)) conv=notrunc 2>/dev/null  # LDA $AF : AND #$00FF
          done
          printf '\xBD\xE0\x0D\xF0\x07' | dd of=test.sfc bs=1 seek=$((0x340E8)) conv=notrunc 2>/dev/null  # $06C0E8 native statue dispatch
          printf '\xAD\x42\x06\x29\xFF\x00' | dd of=test.sfc bs=1 seek=$((0xC568)) conv=notrunc 2>/dev/null  # $01C568 held-switch flag

          # Original Hookshot instructions inspected by Switch Hook's guards.
          printf '\xA5\x11' | dd of=test.sfc bs=1 seek=$((0x43D74)) conv=notrunc 2>/dev/null  # $08BD74 LDA $11
          printf '\x20\x68\x8D' | dd of=test.sfc bs=1 seek=$((0x43DD7)) conv=notrunc 2>/dev/null  # $08BDD7 JSR $8D68
          printf '\xBD\x5E\x0C' | dd of=test.sfc bs=1 seek=$((0x43ECA)) conv=notrunc 2>/dev/null  # $08BECA LDA $0C5E,X

          # Base HUD sheet pointers for $69/$6A/$6B, split across the three
          # pointer tables: $98A967/$98AF1A/$98B3F8. Preserve all nine guards.
          printf '\x98\x98\x98' | dd of=test.sfc bs=1 seek=$((0x505C)) conv=notrunc 2>/dev/null  # $00D05C-$00D05E banks
          printf '\xA9\xAF\xB3' | dd of=test.sfc bs=1 seek=$((0x513B)) conv=notrunc 2>/dev/null  # $00D13B-$00D13D high bytes
          printf '\x67\x1A\xF8' | dd of=test.sfc bs=1 seek=$((0x521A)) conv=notrunc 2>/dev/null  # $00D21A-$00D21C low bytes
          # Maple room-profile guards: exact overwritten instructions and a
          # minimal relocated header chain. Keep production assertions enabled.
          printf '\xB9\x80\xCF\x85\xCA' | dd of=test.sfc bs=1 seek=$((0x0678F)) conv=notrunc 2>/dev/null  # $00E78F BG source-bank load
          printf '\xA9\x1B\x00\x85\x02' | dd of=test.sfc bs=1 seek=$((0xDEF51)) conv=notrunc 2>/dev/null  # $1BEF51 palette source-bank load
          printf '\x0F\x00' | dd of=test.sfc bs=1 seek=$((0x780D0)) conv=notrunc 2>/dev/null  # entrance $68 -> room $00F
          printf '\x03' | dd of=test.sfc bs=1 seek=$((0x79668)) conv=notrunc 2>/dev/null  # entrance main group3
          printf '\x00\x80\x22' | dd of=test.sfc bs=1 seek=$((0x0B5DD)) conv=notrunc 2>/dev/null  # header table $228000
          printf '\x22' | dd of=test.sfc bs=1 seek=$((0x0B5E7)) conv=notrunc 2>/dev/null  # header bank $22
          printf '\x00\x90' | dd of=test.sfc bs=1 seek=$((0x11001E)) conv=notrunc 2>/dev/null  # room $00F header -> $229000
          printf '\x03' | dd of=test.sfc bs=1 seek=$((0x111002)) conv=notrunc 2>/dev/null  # room secondary group3

          # Original instructions guarded by Overworld/music_cache.asm. These
          # are explicit headerless LoROM PC offsets, not relocated cache bytes.
          # LDA.l $7F5B00,X at SNES $00F401, $02AE73, $02B117, $02B126,
          # $02B2A1, $02B2AA, $02B4FE, $02C27D, $02C28F and $0ABC80.
          for music_cache_pc in 0x07401 0x12E73 0x13117 0x13126 0x132A1 0x132AA 0x134FE 0x1427D 0x1428F 0x53C80; do
            printf '\xBF\x00\x5B\x7F' | dd of=test.sfc bs=1 seek=$((music_cache_pc)) conv=notrunc 2>/dev/null
          done
          # STA.l $7F5B00,X at SNES $02C49A and $02C4AB.
          for music_cache_pc in 0x1449A 0x144AB; do
            printf '\x9F\x00\x5B\x7F' | dd of=test.sfc bs=1 seek=$((music_cache_pc)) conv=notrunc 2>/dev/null
          done
          printf '\xE0\x40\x00' | dd of=test.sfc bs=1 seek=$((0x144A0)) conv=notrunc 2>/dev/null  # $02C4A0 CPX.w #$0040
          printf '\xC0\x60\x00' | dd of=test.sfc bs=1 seek=$((0x144B1)) conv=notrunc 2>/dev/null  # $02C4B1 CPY.w #$0060
          printf '\x8F\x80\x5B\x7F' | dd of=test.sfc bs=1 seek=$((0x144B8)) conv=notrunc 2>/dev/null  # $02C4B8 STA.l $7F5B80 (storm opt-out guard)

          # Preimage bytes taken from the readN() guards in Dungeons/sky_d8_award.asm.
          # Synthetic only; fails on unparsed read guards or conflicting bytes.
          python3 .github/scripts/seed_sky_award_preimages.py Dungeons/sky_d8_award.asm test.sfc

          # Run Asar against the synthetic headerless ROM.
          set -o pipefail
          ./asar/asar --no-title-check Oracle_main.asm test.sfc 2>&1 | tee asar_output.txt

          echo "ASM syntax check passed"

  # =============================================================================
  # Lua Script Validation
  # =============================================================================
  # Basic syntax check for Lua test scripts
  lua-check:
    name: Lua Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check Lua Syntax
        run: |
          # Check all Lua scripts for syntax errors
          errors=0
          while IFS= read -r -d '' file; do
            echo "Checking $file..."
            if ! luac5.4 -p "$file" 2>&1; then
              echo "::error file=$file::Syntax error in $file"
              errors=$((errors + 1))
            fi
          done < <(find Scripts/Lua -type f -name '*.lua' -print0)

          if [ $errors -gt 0 ]; then
            echo "::error::Found $errors Lua syntax errors"
            exit 1
          fi

          echo "All Lua scripts passed syntax check"

  # =============================================================================
  # Test Summary
  # =============================================================================
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [asm-check, lua-check]
    if: ${{ !cancelled() }}

    steps:
      - name: Check Results
        run: |
          echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.asm-check.result }}" == "success" ]; then
            echo "- ASM Syntax: :white_check_mark: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ASM Syntax: :x: Failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.lua-check.result }}" == "success" ]; then
            echo "- Lua Syntax: :white_check_mark: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Lua Syntax: :x: Failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.asm-check.result }}" != "success" ] || [ "${{ needs.lua-check.result }}" != "success" ]; then
            exit 1
          fi
