name: ROM Tests

on:
  push:
    branches: [master]
  pull_request:
    # Any base branch (stacked PRs). `edited` covers base retargets.
    # No path filter: the jobs take ~25 s, and a filtered workflow cannot be
    # a required check. Do not add an `edited`-only job guard: a skipped
    # check counts as passing.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# Only PR runs share a group (one per PR); push and workflow_dispatch runs get
# a unique group (run_id), so a master push never cancels or replaces a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =============================================================================
  # ASM Syntax Check
  # =============================================================================
  # Validates ASM files compile without errors using Asar
  asm-check:
    name: ASM Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Asar
        run: |
          # The v1.91 release archive contains only asar.exe, so build the
          # Linux CLI from the exact v1.91 source commit.
          ASAR_COMMIT=6a6dbdaed8cb773e583052ce4f66375bd896c3a1
          wget -q "https://github.com/RPGHacker/asar/archive/${ASAR_COMMIT}.tar.gz" -O asar-src.tar.gz
          mkdir asar-src
          tar -xzf asar-src.tar.gz --strip-components=1 -C asar-src
          cmake -S asar-src/src -B asar-build -DCMAKE_BUILD_TYPE=Release
          cmake --build asar-build --config Release --target asar-standalone --parallel 2
          mkdir -p asar
          install -m 755 asar-build/asar/bin/asar asar/asar
          ./asar/asar --version

      - name: Check ASM Syntax
        run: |
          # Create a dummy ROM for syntax checking (Asar needs a file to write to)
          # This only validates syntax, not actual assembly output
          dd if=/dev/zero of=test.sfc bs=1024 count=2048 2>/dev/null

          # Seed the source bytes inspected by guarded patches and the message
          # bank terminator scanned at assembly time.
          printf '\x73\x80\x39' | dd of=test.sfc bs=1 seek=$((0xE9E6)) conv=notrunc 2>/dev/null
          printf '\x7A\x80\x38' | dd of=test.sfc bs=1 seek=$((0xE9F5)) conv=notrunc 2>/dev/null
          printf '\x7F' | dd of=test.sfc bs=1 seek=$((0x773FF)) conv=notrunc 2>/dev/null

          # Minimal coherent data for ROM-reading guards (source assertions unchanged):
          # a one-entry D7 room $A2 sprite list with the big-key drop, and vanilla bytes for
          # tile types $055/$07C, the pit-damage table tail, the item-receipt operand and
          # King Dodongo health. Not real ROM content; real-ROM checks run in build_rom.sh.
          printf '\x00\xC8' | dd of=test.sfc bs=1 seek=$((0x4C298)) conv=notrunc 2>/dev/null  # $09C298 RoomData_SpritePointers operand -> fixture table $09:C800
          printf '\x00\xCA' | dd of=test.sfc bs=1 seek=$((0x4C944)) conv=notrunc 2>/dev/null  # $09C944 room $A2 sprite list -> $09:CA00
          printf '\x00\xFD\x00\xE4\xFF' | dd of=test.sfc bs=1 seek=$((0x4CA00)) conv=notrunc 2>/dev/null  # $09CA00 header, big-key drop $FD,$00,$E4, end $FF
          printf '\x02' | dd of=test.sfc bs=1 seek=$((0x716AE)) conv=notrunc 2>/dev/null  # $0E96AE tile $055 type (vanilla $02)
          printf '\x00' | dd of=test.sfc bs=1 seek=$((0x716D5)) conv=notrunc 2>/dev/null  # $0E96D5 tile $07C type (vanilla $00)
          printf '\x23\x01' | dd of=test.sfc bs=1 seek=$((0x197A)) conv=notrunc 2>/dev/null  # $00997A pit-damage table filler $0123 (vanilla)
          printf '\x23\x01' | dd of=test.sfc bs=1 seek=$((0x197C)) conv=notrunc 2>/dev/null  # $00997C pit-damage table filler $0123 (vanilla)
          printf '\x30\x02' | dd of=test.sfc bs=1 seek=$((0x4863E)) conv=notrunc 2>/dev/null  # $09863E AncillaAdd_ItemReceipt operand $0230 (vanilla)
          printf '\x28' | dd of=test.sfc bs=1 seek=$((0x6B205)) conv=notrunc 2>/dev/null  # $0DB205 King Dodongo health (vanilla $28)
          printf '\xD3' | dd of=test.sfc bs=1 seek=$((0x30203)) conv=notrunc 2>/dev/null  # $068203 terrain secret $10: original Stal sprite
          printf '\xA9\x78\x07' | dd of=test.sfc bs=1 seek=$((0x6F80)) conv=notrunc 2>/dev/null  # $00EF80 Module15 HDMA refill LDA.w #$0778 (vanilla)
          printf '\xE2\x30\xAB\x6B' | dd of=test.sfc bs=1 seek=$((0x75447)) conv=notrunc 2>/dev/null  # $0ED447 CreateMessagePointers epilogue SEP #$30/PLB/RTL (Core/minish_tutorials.asm)

          # Original exit open-door draw and return sites guarded by Overworld/entrances.asm.
          printf '\xA9\xA4\x0D\x9F\x00\x20\x7E' | dd of=test.sfc bs=1 seek=$((0x16EF7)) conv=notrunc 2>/dev/null  # $02EEF7 LDA #$0DA4 : STA $7E2000,X
          printf '\x9F\x02\x20\x7E' | dd of=test.sfc bs=1 seek=$((0x16F1A)) conv=notrunc 2>/dev/null  # $02EF1A STA $7E2002,X
          printf '\x9C\x96\x06' | dd of=test.sfc bs=1 seek=$((0x16F26)) conv=notrunc 2>/dev/null  # $02EF26 STZ $0696

          # Original tag $24 vector and Holes2 body guarded by custom_tag.asm.
          printf '\x89\xCC' | dd of=test.sfc bs=1 seek=$((0xC2C5)) conv=notrunc 2>/dev/null  # $01C2C5 vector -> $01CC89
          printf '\xC2\x30\x20\xCC\xCD\x90\xF6\xA0\x05\x00\x80\xD9' | dd of=test.sfc bs=1 seek=$((0xCC89)) conv=notrunc 2>/dev/null  # $01CC89 RoomTag_Holes2

          # Original Somaria offscreen deletion pair, continuation and draw RTS.
          printf '\x9C\x46\x06\x9E\x4A\x0C\x8A' | dd of=test.sfc bs=1 seek=$((0x46731)) conv=notrunc 2>/dev/null
          printf '\x60' | dd of=test.sfc bs=1 seek=$((0x4674B)) conv=notrunc 2>/dev/null

          # Native per-slot Somaria cleanup prologue, branch and continuations.
          printf '\x8B\x4B\xAB\xA2' | dd of=test.sfc bs=1 seek=$((0x4AC6B)) conv=notrunc 2>/dev/null
          printf '\xBD\x4A\x0C\xC9\x2C\xD0\x0D\x9C\x46\x06\xA5\x48\x29\x80' | dd of=test.sfc bs=1 seek=$((0x4AC7A)) conv=notrunc 2>/dev/null
          printf '\xCA' | dd of=test.sfc bs=1 seek=$((0x4ACA9)) conv=notrunc 2>/dev/null

          # Original desert-statue contact/prep instructions inspected by Garo's guards.
          printf '\x22\x29\xF1\x06' | dd of=test.sfc bs=1 seek=$((0x29573)) conv=notrunc 2>/dev/null  # $059573 JSL $06F129
          printf '\xAD\x6A\x0B\x9D\x90\x0D' | dd of=test.sfc bs=1 seek=$((0x30F4D)) conv=notrunc 2>/dev/null  # $068F4D LDA $0B6A : STA $0D90,X

          # Native NMI joypad call and unused trampoline bytes for Time's note.
          printf '\x20\xE0\x89\x20\xD1\x83' | dd of=test.sfc bs=1 seek=$((0x13E)) conv=notrunc 2>/dev/null
          printf '\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF\xFF' | dd of=test.sfc bs=1 seek=$((0x9C2)) conv=notrunc 2>/dev/null

          # Original NMI and bomb draw instructions inspected by Bombchu's guards.
          printf '\xAE\x34\x01\x8E\x16\x21' | dd of=test.sfc bs=1 seek=$((0xB56)) conv=notrunc 2>/dev/null
          printf '\xBD\x10\x9D' | dd of=test.sfc bs=1 seek=$((0x427D7)) conv=notrunc 2>/dev/null
          printf '\xBD\x11\x9D' | dd of=test.sfc bs=1 seek=$((0x427DD)) conv=notrunc 2>/dev/null

          # Original ammunition and pickup instructions guarded by Bombchu supply.
          printf '\xAF\x43\xF3\x7E' | dd of=test.sfc bs=1 seek=$((0x48127)) conv=notrunc 2>/dev/null  # $098127 LDA.l $7EF343
          printf '\x8F\x43\xF3\x7E' | dd of=test.sfc bs=1 seek=$((0x48133)) conv=notrunc 2>/dev/null  # $098133 STA.l $7EF343
          printf '\xBC\x20\x0E\xB9\xF9\xD0' | dd of=test.sfc bs=1 seek=$((0x351D8)) conv=notrunc 2>/dev/null  # $06D1D8 LDY $0E20,X : LDA $D0F9,Y
          printf '\xBC\x20\x0E\xB9\x44\xD1' | dd of=test.sfc bs=1 seek=$((0x35257)) conv=notrunc 2>/dev/null  # $06D257 LDY $0E20,X : LDA $D144,Y

          # Original message-pointer epilogue guarded by the Minish tutorials.
          printf '\xE2\x30\xAB\x6B' | dd of=test.sfc bs=1 seek=$((0x75447)) conv=notrunc 2>/dev/null  # $0ED447 SEP #$30 : PLB : RTL

          # Original room-tag, hidden-chest and statue instructions guarded by
          # Song of Secrets / Elegy of Stone; headerless LoROM PC offsets.
          printf '\xA9\x08\x80\x0E' | dd of=test.sfc bs=1 seek=$((0xCC0C)) conv=notrunc 2>/dev/null  # $01CC0C tag $35 hole handler
          for secrets_tag_a_pc in 0x9905 0x996D 0xBCC2; do
            printf '\xA5\xAE\x29\xFF\x00' | dd of=test.sfc bs=1 seek=$((secrets_tag_a_pc)) conv=notrunc 2>/dev/null  # LDA $AE : AND #$00FF
          done
          for secrets_tag_b_pc in 0x9923 0x998B 0xBCE0; do
            printf '\xA5\xAF\x29\xFF\x00' | dd of=test.sfc bs=1 seek=$((secrets_tag_b_pc)) conv=notrunc 2>/dev/null  # LDA $AF : AND #$00FF
          done
          printf '\xBD\xE0\x0D\xF0\x07' | dd of=test.sfc bs=1 seek=$((0x340E8)) conv=notrunc 2>/dev/null  # $06C0E8 native statue dispatch
          printf '\xAD\x42\x06\x29\xFF\x00' | dd of=test.sfc bs=1 seek=$((0xC568)) conv=notrunc 2>/dev/null  # $01C568 held-switch flag

          # Original Hookshot instructions inspected by Switch Hook's guards.
          printf '\xA5\x11' | dd of=test.sfc bs=1 seek=$((0x43D74)) conv=notrunc 2>/dev/null  # $08BD74 LDA $11
          printf '\x20\x68\x8D' | dd of=test.sfc bs=1 seek=$((0x43DD7)) conv=notrunc 2>/dev/null  # $08BDD7 JSR $8D68
          printf '\xBD\x5E\x0C' | dd of=test.sfc bs=1 seek=$((0x43ECA)) conv=notrunc 2>/dev/null  # $08BECA LDA $0C5E,X

          # Base HUD sheet pointers for $69/$6A/$6B, split across the three
          # pointer tables: $98A967/$98AF1A/$98B3F8. Preserve all nine guards.
          printf '\x98\x98\x98' | dd of=test.sfc bs=1 seek=$((0x505C)) conv=notrunc 2>/dev/null  # $00D05C-$00D05E banks
          printf '\xA9\xAF\xB3' | dd of=test.sfc bs=1 seek=$((0x513B)) conv=notrunc 2>/dev/null  # $00D13B-$00D13D high bytes
          printf '\x67\x1A\xF8' | dd of=test.sfc bs=1 seek=$((0x521A)) conv=notrunc 2>/dev/null  # $00D21A-$00D21C low bytes

          # Original instructions guarded by Garo's action-hitbox and armored
          # Darknut hooks. Real-ROM builds retain the same source assertions.
          printf '\xAF\xC5\xF3\x7E' | dd of=test.sfc bs=1 seek=$((0x39104)) conv=notrunc 2>/dev/null  # $079104 LDA.l GameState, guarded by GaroMask_DashSword
          printf '\xBD\xAE\xF4' | dd of=test.sfc bs=1 seek=$((0x37633)) conv=notrunc 2>/dev/null
          printf '\xBD\x30\xF5' | dd of=test.sfc bs=1 seek=$((0x37638)) conv=notrunc 2>/dev/null
          printf '\xBD\x60\x0E' | dd of=test.sfc bs=1 seek=$((0x36D8E)) conv=notrunc 2>/dev/null
          printf '\x29\x40\xD0\x0A' | dd of=test.sfc bs=1 seek=$((0x36D91)) conv=notrunc 2>/dev/null

          # Original instructions guarded by Overworld/music_cache.asm. These
          # are explicit headerless LoROM PC offsets, not relocated cache bytes.
          # LDA.l $7F5B00,X at SNES $00F401, $02AE73, $02B117, $02B126,
          # $02B2A1, $02B2AA, $02B4FE, $02C27D, $02C28F and $0ABC80.
          for music_cache_pc in 0x07401 0x12E73 0x13117 0x13126 0x132A1 0x132AA 0x134FE 0x1427D 0x1428F 0x53C80; do
            printf '\xBF\x00\x5B\x7F' | dd of=test.sfc bs=1 seek=$((music_cache_pc)) conv=notrunc 2>/dev/null
          done
          # STA.l $7F5B00,X at SNES $02C49A and $02C4AB.
          for music_cache_pc in 0x1449A 0x144AB; do
            printf '\x9F\x00\x5B\x7F' | dd of=test.sfc bs=1 seek=$((music_cache_pc)) conv=notrunc 2>/dev/null
          done
          printf '\xE0\x40\x00' | dd of=test.sfc bs=1 seek=$((0x144A0)) conv=notrunc 2>/dev/null  # $02C4A0 CPX.w #$0040
          printf '\xC0\x60\x00' | dd of=test.sfc bs=1 seek=$((0x144B1)) conv=notrunc 2>/dev/null  # $02C4B1 CPY.w #$0060
          printf '\x8F\x80\x5B\x7F' | dd of=test.sfc bs=1 seek=$((0x144B8)) conv=notrunc 2>/dev/null  # $02C4B8 STA.l $7F5B80 (storm opt-out guard)

          # Original music-loader instructions and upload headers guarded by
          # Music/song_banks.asm and Overworld/great_sea_music.asm. These are
          # synthetic preimages; all source assertions remain active.
          printf '\xA9\x00\x85\x00\xA9\x80\x85\x01\xA9\x19\x85\x02\x78\x20\x88\x88\x58\x60' | dd of=test.sfc bs=1 seek=$((0x00901)) conv=notrunc 2>/dev/null  # $008901 original cold loader, 18 bytes
          printf '\xA9\xF5' | dd of=test.sfc bs=1 seek=$((0x00913)) conv=notrunc 2>/dev/null  # $008913 LDA.b #$F5
          printf '\x9E' | dd of=test.sfc bs=1 seek=$((0x00918)) conv=notrunc 2>/dev/null  # $008918 OW chain high byte
          printf '\x1A' | dd of=test.sfc bs=1 seek=$((0x0091C)) conv=notrunc 2>/dev/null  # $00891C OW chain bank
          printf '\xAE\x2D\x00\xD0' | dd of=test.sfc bs=1 seek=$((0xD1EF5)) conv=notrunc 2>/dev/null  # $1A9EF5 OW main size/ARAM
          printf '\x88\x06\x00\x2B' | dd of=test.sfc bs=1 seek=$((0xD4CA7)) conv=notrunc 2>/dev/null  # $1ACCA7 OW aux size/ARAM
          printf '\x0C\x05\x00\x2B' | dd of=test.sfc bs=1 seek=$((0xDACC3)) conv=notrunc 2>/dev/null  # $1BACC3 UW aux size/ARAM
          printf '\x8D\x40\x21\x8D\x33\x01' | dd of=test.sfc bs=1 seek=$((0x000F3)) conv=notrunc 2>/dev/null  # $0080F3 STA.w APUIO0 : STA.w $0133

          # Original overlay call guarded by Overworld/lyra_overlay_fix.asm.
          printf '\x22\x52\xF6\x0E' | dd of=test.sfc bs=1 seek=$((0x16F50)) conv=notrunc 2>/dev/null  # $02EF50 JSL $0EF652

          # Both native room-object pointer loads guarded by Dungeons/d4_water_control.asm.
          for d4_object_pointer_pc in 0x8745 0x883E; do
            printf '\xBF\x01\x80\x1F\x85\xB8\xBF\x00\x80\x1F\x85\xB7' | dd of=test.sfc bs=1 seek=$((d4_object_pointer_pc)) conv=notrunc 2>/dev/null  # LDA.l $1F8001,X : STA $B8 : LDA.l $1F8000,X : STA $B7
          done

          # Vanilla hook-site bytes guarded by Dungeons/wall_profile_selector.asm.
          printf '\xBF\x00\x80\x01\xAA' | dd of=test.sfc bs=1 seek=$((0x8979)) conv=notrunc 2>/dev/null  # $018979 H1 LDA.l $018000,X : TAX
          printf '\xBF\xF0\x83\x01\xAA' | dd of=test.sfc bs=1 seek=$((0x89AE)) conv=notrunc 2>/dev/null  # $0189AE H2 LDA.l $0183F0,X : TAX
          printf '\xBF\x19\x97\x0E\x9F\xC0\xFE\x7E' | dd of=test.sfc bs=1 seek=$((0x717F5)) conv=notrunc 2>/dev/null  # $0E97F5 LoadDefaultTileTypes slot-3 copy
          printf '\xC8\xB7\x0D\x8D\xA2\x0A' | dd of=test.sfc bs=1 seek=$((0xB641)) conv=notrunc 2>/dev/null  # $01B641 H3 INY : LDA [$0D],Y : STA $0AA2

          # Vanilla spare blockset rows, palette offsets and slot-3 sheet guarded by
          # Dungeons/Data/kits/kits.asm (real base-ROM bytes).
          printf '\x09\x00\x24\x1B\x08\x00\x22\x1B\x09\x00\x25\x1B\x09\x00\x26\x1B' | dd of=test.sfc bs=1 seek=$((0x5DF3)) conv=notrunc 2>/dev/null  # $00DDF3 rows $17-$1A
          printf '\x0B' | dd of=test.sfc bs=1 seek=$((0x5DC3)) conv=notrunc 2>/dev/null  # $00DDC3 slot-3 sheet $0B
          printf '\xF4\x0B\xA8\x0C\x5C\x0D' | dd of=test.sfc bs=1 seek=$((0xDEC6D)) conv=notrunc 2>/dev/null  # $1BEC6D palette $22/$24/$26 offsets
          printf '\xA0\x05' | dd of=test.sfc bs=1 seek=$((0xDEC5B)) conv=notrunc 2>/dev/null  # $1BEC5B palette $10 offset
          printf '\xD0\x02' | dd of=test.sfc bs=1 seek=$((0xDEC53)) conv=notrunc 2>/dev/null  # $1BEC53 palette $08 offset
          # Room headers: three synthetic records with the real header bytes of a default
          # room, D1 room $007 (palette set $0F -> $10, blockset $07) and Glacia room $09E
          # (palette set $13 -> $08, blockset $0B). Each kit room points at its record.
          python3 - <<'PY'
          import re
          src = open('Dungeons/Data/kits/kits.asm').read()
          d1 = {int(m, 16) for m in re.findall(r'read2\(\$228000\+\$([0-9A-F]+)\)\)\+1\)\*4\)\) == \$10', src)}
          gl = {int(m, 16) for m in re.findall(r'read2\(\$228000\+\$([0-9A-F]+)\)\)\+2\) == \$0B', src)}
          with open('test.sfc', 'r+b') as f:
              for room in range(0x128):
                  off = room * 2
                  ptr = 0x8310 if off in d1 else 0x8320 if off in gl else 0x8300
                  f.seek(0x110000 + off); f.write(ptr.to_bytes(2, 'little'))  # $228000 header pointers
              f.seek(0x110300); f.write(bytes([0x00, 0x00, 0x00]))  # $228300 default
              f.seek(0x110310); f.write(bytes([0xC0, 0x0F, 0x07]))  # $228310 D1 grotto
              f.seek(0x110320); f.write(bytes([0x20, 0x13, 0x0B]))  # $228320 Glacia
              f.seek(0x7549C); f.write(b'\x10')  # $0ED49C palette set $0F
              f.seek(0x754AC); f.write(b'\x08')  # $0ED4AC palette set $13
          print(f'kit header fixture: {len(d1)} D1 rooms, {len(gl)} Glacia rooms')
          PY

          # Common item-receipt completion guarded by Sprites/Enemies/custom_guard.asm.
          printf '\x9C\xE9\x02\xBD\x5E\x0C' | dd of=test.sfc bs=1 seek=$((0x4443B)) conv=notrunc 2>/dev/null  # $08C43B STZ $02E9 : LDA $0C5E,X

          # Native camera-cache, spiral-layout and follower-message bytes guarded by Sprites/Bosses/d4_pressure_warden.asm.
          printf '\xC2\x20\xA5\xE2\x8F\x80\xC1\x7E' | dd of=test.sfc bs=1 seek=$((0x10D81)) conv=notrunc 2>/dev/null  # $028D81 REP #$20 : LDA $E2 : STA.l $7EC180
          printf '\x22\xDC\xB5\x02' | dd of=test.sfc bs=1 seek=$((0x11122)) conv=notrunc 2>/dev/null  # $029122 JSL Underworld_AdjustForRoomLayout
          printf '\x22\xAA\xFD\x0F' | dd of=test.sfc bs=1 seek=$((0x4A01F)) conv=notrunc 2>/dev/null  # $09A01F JSL $0FFDAA

          # Preimage bytes taken from the readN() guards in Dungeons/sky_d8_award.asm.
          # Synthetic only; fails on unparsed read guards or conflicting bytes.
          python3 .github/scripts/test_seed_sky_award_preimages.py
          python3 .github/scripts/seed_sky_award_preimages.py Dungeons/sky_d8_award.asm test.sfc
          # Same for the D7 crystal-ceremony hooks (Dungeons/d7_farore_rescue.asm).
          python3 .github/scripts/seed_sky_award_preimages.py Dungeons/d7_farore_rescue.asm test.sfc
          # Same for the D6 native door-condition hooks; keep the ASM guards active.
          python3 .github/scripts/seed_sky_award_preimages.py Dungeons/d6_cart_circuit.asm test.sfc
          # Same for all 25 receipt hooks; validate the macro and keep every guard active.
          python3 .github/scripts/seed_sky_award_preimages.py Items/bombchu_receipt.asm test.sfc
          # Seed the Switch Hook entry and camera guards, including its RTL trampoline.
          python3 .github/scripts/seed_sky_award_preimages.py Items/switch_hook.asm test.sfc

          # Sky Tower graphics, sky layer and pit-damage guards (ENABLE_SKY_* default on).
          # Real base-ROM bytes for every readN() assert in Dungeons/sky_tower_graphics.asm,
          # sky_room_sky.asm and sky_pit_damage.asm; the bank $33 free-slot checks read zero.
          printf '\x73\xE0' | dd of=test.sfc bs=1 seek=$((0x6237)) conv=notrunc 2>/dev/null  # $00E237 Sky main graphics table pointer
          printf '\x0A\x01\x15\x08\x0E\x22\x1B\x0F' | dd of=test.sfc bs=1 seek=$((0x607B)) conv=notrunc 2>/dev/null  # $00E07B Sky source main group
          printf '\x61\x01\x10\x62\x0E\x26\x1B\x0F' | dd of=test.sfc bs=1 seek=$((0x60B3)) conv=notrunc 2>/dev/null  # $00E0B3 Sky destination main group
          printf '\x5D\x5D\x5D\x5D\x5D\x5D\x5F\x5D' | dd of=test.sfc bs=1 seek=$((0x1011F)) conv=notrunc 2>/dev/null  # $02811F Sky animation group bytes $02811F/$028126
          printf '\x01' | dd of=test.sfc bs=1 seek=$((0x79629)) conv=notrunc 2>/dev/null  # $0F9629 Sky entrance $29 main group
          printf '\x08\x00\x22\x1B' | dd of=test.sfc bs=1 seek=$((0x5D9B)) conv=notrunc 2>/dev/null  # $00DD9B Sky source secondary group
          printf '\x0C\x00\x26\x1B' | dd of=test.sfc bs=1 seek=$((0x5DBF)) conv=notrunc 2>/dev/null  # $00DDBF Sky destination secondary group
          printf '\x1B' | dd of=test.sfc bs=1 seek=$((0x5DC2)) conv=notrunc 2>/dev/null  # $00DDC2 Sky secondary group0A slot6
          printf '\x04\x04\x03\x0A' | dd of=test.sfc bs=1 seek=$((0x75474)) conv=notrunc 2>/dev/null  # $0ED474 Sky source palette set
          printf '\x02\x00\x0F\x14' | dd of=test.sfc bs=1 seek=$((0x75480)) conv=notrunc 2>/dev/null  # $0ED480 Sky destination palette set
          printf '\xD8\x09' | dd of=test.sfc bs=1 seek=$((0xDEC67)) conv=notrunc 2>/dev/null  # $1BEC67 Sky global palette14 pointer
          printf '\xA7\x14' | dd of=test.sfc bs=1 seek=$((0xDD89C)) conv=notrunc 2>/dev/null  # $1BD89C Sky palette word 0 source
          printf '\x08\x0A' | dd of=test.sfc bs=1 seek=$((0x110A61)) conv=notrunc 2>/dev/null  # $228A61 Room $090 graphics input
          printf '\x08\x0A' | dd of=test.sfc bs=1 seek=$((0x110A6F)) conv=notrunc 2>/dev/null  # $228A6F Room $091 graphics input
          printf '\x08\x0A' | dd of=test.sfc bs=1 seek=$((0x110A7D)) conv=notrunc 2>/dev/null  # $228A7D Room $092 graphics input
          printf '\x08\x0A' | dd of=test.sfc bs=1 seek=$((0x110A8B)) conv=notrunc 2>/dev/null  # $228A8B Room $093 graphics input
          printf '\x22\x3A\x87\x01' | dd of=test.sfc bs=1 seek=$((0x10CE5)) conv=notrunc 2>/dev/null  # $028CE5 Underworld_InitializeRoomFromSpecial JSL LoadRoom
          printf '\x22\x3A\x87\x01' | dd of=test.sfc bs=1 seek=$((0x11407)) conv=notrunc 2>/dev/null  # $029407 Module07_11_02 JSL LoadRoom
          printf '\x22\x3A\x87\x01' | dd of=test.sfc bs=1 seek=$((0x14583)) conv=notrunc 2>/dev/null  # $02C583 Underworld_LoadAndDrawRoom JSL LoadRoom
          printf '\x0B\x00\x0E\x00\x14\x00\x1A\x00\x1C\x00\x1E\x00\x3C\x00\x3F\x00\x45\x00\x47\x00\x48\x00\x49\x00\x56\x00\x59\x00\x5F\x00\x66\x00\x67\x00\x69\x00\x6E\x00\x71\x00\x73\x00\x74\x00\x75\x00\x76\x00\x77\x00\x7B\x00\x7D\x00\x7E\x00\x7F\x00\x83\x00\x84\x00\x85\x00\x86\x00\x87\x00\x89\x00\x8C\x00\x8E\x00\x8F\x00\xAC\x00\xB1\x00\xB4\x00\xB5\x00\xB9\x00\xC4\x00\xC6\x00\xC7\x00\xCB\x00\xD6\x00\xD7\x00\xD8\x00\xDE\x00\x0B\x01' | dd of=test.sfc bs=1 seek=$((0x190C)) conv=notrunc 2>/dev/null  # $00990C RoomsWithPitDamage base table (52 words)
          printf '\xA2\x70\x00\xA5\xA0\xDF\x0C\x99\x00' | dd of=test.sfc bs=1 seek=$((0x394A5)) conv=notrunc 2>/dev/null  # $0794A5 Pit-damage scan LDX #imm + CMP.l table

          # Grow to the real 4 MiB base size after the seeders, which validate the
          # 2 MiB image. Keeps zero-filled bank $50 in bounds for the D4 water slot
          # guard at $508000-$50A000 (PC $280000).
          dd if=/dev/zero of=test.sfc bs=1024 count=2048 seek=2048 conv=notrunc 2>/dev/null

          # Run Asar against the synthetic headerless ROM.
          set -o pipefail
          ./asar/asar --no-title-check Oracle_main.asm test.sfc 2>&1 | tee asar_output.txt

          echo "ASM syntax check passed"

  # =============================================================================
  # Lua Script Validation
  # =============================================================================
  # Basic syntax check for Lua test scripts
  lua-check:
    name: Lua Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lua compiler
        run: |
          # Byte-identical official release, cached by Buildroot to avoid apt DNS.
          # Published checksum: https://www.lua.org/ftp/
          LUA_VERSION=5.4.8
          LUA_SHA256=4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae
          LUA_BUILD="$RUNNER_TEMP/lua-source"
          mkdir -p "$LUA_BUILD" "$RUNNER_TEMP/lua-bin"
          curl --fail --location --connect-timeout 15 --max-time 120 \
            "https://sources.buildroot.net/lua/lua-${LUA_VERSION}.tar.gz" -o "$LUA_BUILD/lua.tar.gz"
          echo "$LUA_SHA256  $LUA_BUILD/lua.tar.gz" | sha256sum -c -
          tar -xzf "$LUA_BUILD/lua.tar.gz" -C "$LUA_BUILD"
          # Only luac with generic flags: no readline or other apt package.
          make -C "$LUA_BUILD/lua-${LUA_VERSION}/src" --jobs=2 luac
          cp "$LUA_BUILD/lua-${LUA_VERSION}/src/luac" "$RUNNER_TEMP/lua-bin/luac5.4"
          "$RUNNER_TEMP/lua-bin/luac5.4" -v
          echo "$RUNNER_TEMP/lua-bin" >> "$GITHUB_PATH"

      - name: Check Lua Syntax
        run: |
          # Check all Lua scripts for syntax errors
          errors=0
          while IFS= read -r -d '' file; do
            echo "Checking $file..."
            if ! luac5.4 -p "$file" 2>&1; then
              echo "::error file=$file::Syntax error in $file"
              errors=$((errors + 1))
            fi
          done < <(find Scripts/Lua -type f -name '*.lua' -print0)

          if [ $errors -gt 0 ]; then
            echo "::error::Found $errors Lua syntax errors"
            exit 1
          fi

          echo "All Lua scripts passed syntax check"

  # =============================================================================
  # Test Summary
  # =============================================================================
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [asm-check, lua-check]
    if: ${{ !cancelled() }}

    steps:
      - name: Check Results
        run: |
          echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.asm-check.result }}" == "success" ]; then
            echo "- ASM Syntax: :white_check_mark: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ASM Syntax: :x: Failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.lua-check.result }}" == "success" ]; then
            echo "- Lua Syntax: :white_check_mark: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Lua Syntax: :x: Failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.asm-check.result }}" != "success" ] || [ "${{ needs.lua-check.result }}" != "success" ]; then
            exit 1
          fi
