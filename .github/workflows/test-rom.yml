name: ROM Tests

on:
  push:
    branches: [master, develop]
    paths:
      - '**/*.asm'
      - '**/*.lua'
      - 'Scripts/**'
      - '.github/workflows/test-rom.yml'
  pull_request:
    branches: [master]
    paths:
      - '**/*.asm'
      - '**/*.lua'
      - 'Scripts/**'
      - '.github/workflows/test-rom.yml'
  workflow_dispatch:
    inputs:
      run_emulator_tests:
        description: 'Run emulator tests (requires self-hosted runner with ROM)'
        required: false
        default: false
        type: boolean

jobs:
  # =============================================================================
  # ASM Syntax Check
  # =============================================================================
  # Validates ASM files compile without errors using Asar
  asm-check:
    name: ASM Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Asar
        run: |
          # The v1.91 release archive contains only asar.exe, so build the
          # Linux CLI from the exact v1.91 source commit.
          ASAR_COMMIT=6a6dbdaed8cb773e583052ce4f66375bd896c3a1
          wget -q "https://github.com/RPGHacker/asar/archive/${ASAR_COMMIT}.tar.gz" -O asar-src.tar.gz
          mkdir asar-src
          tar -xzf asar-src.tar.gz --strip-components=1 -C asar-src
          cmake -S asar-src/src -B asar-build -DCMAKE_BUILD_TYPE=Release
          cmake --build asar-build --config Release --target asar-standalone --parallel 2
          mkdir -p asar
          install -m 755 asar-build/asar/bin/asar asar/asar
          ./asar/asar --version

      - name: Check ASM Syntax
        run: |
          # Create a dummy ROM for syntax checking (Asar needs a file to write to)
          # This only validates syntax, not actual assembly output
          dd if=/dev/zero of=test.sfc bs=1024 count=2048 2>/dev/null

          # Seed the source bytes inspected by guarded patches and the message
          # bank terminator scanned at assembly time.
          printf '\x73\x80\x39' | dd of=test.sfc bs=1 seek=$((0xE9E6)) conv=notrunc 2>/dev/null
          printf '\x7A\x80\x38' | dd of=test.sfc bs=1 seek=$((0xE9F5)) conv=notrunc 2>/dev/null
          printf '\x7F' | dd of=test.sfc bs=1 seek=$((0x773FF)) conv=notrunc 2>/dev/null

          # Minimal coherent data for ROM-reading guards (source assertions unchanged):
          # a one-entry D7 room $A2 sprite list with the big-key drop, and vanilla bytes for
          # tile types $055/$07C, the pit-damage table tail, the item-receipt operand and
          # King Dodongo health. Not real ROM content; real-ROM checks run in build_rom.sh.
          printf '\x00\xC8' | dd of=test.sfc bs=1 seek=$((0x4C298)) conv=notrunc 2>/dev/null  # $09C298 RoomData_SpritePointers operand -> fixture table $09:C800
          printf '\x00\xCA' | dd of=test.sfc bs=1 seek=$((0x4C944)) conv=notrunc 2>/dev/null  # $09C944 room $A2 sprite list -> $09:CA00
          printf '\x00\xFD\x00\xE4\xFF' | dd of=test.sfc bs=1 seek=$((0x4CA00)) conv=notrunc 2>/dev/null  # $09CA00 header, big-key drop $FD,$00,$E4, end $FF
          printf '\x02' | dd of=test.sfc bs=1 seek=$((0x716AE)) conv=notrunc 2>/dev/null  # $0E96AE tile $055 type (vanilla $02)
          printf '\x00' | dd of=test.sfc bs=1 seek=$((0x716D5)) conv=notrunc 2>/dev/null  # $0E96D5 tile $07C type (vanilla $00)
          printf '\x23\x01' | dd of=test.sfc bs=1 seek=$((0x197C)) conv=notrunc 2>/dev/null  # $00997C pit-damage table filler $0123 (vanilla)
          printf '\x30\x02' | dd of=test.sfc bs=1 seek=$((0x4863E)) conv=notrunc 2>/dev/null  # $09863E AncillaAdd_ItemReceipt operand $0230 (vanilla)
          printf '\x28' | dd of=test.sfc bs=1 seek=$((0x6B205)) conv=notrunc 2>/dev/null  # $0DB205 King Dodongo health (vanilla $28)

          # Original instructions guarded by Overworld/music_cache.asm. These
          # are explicit headerless LoROM PC offsets, not relocated cache bytes.
          # LDA.l $7F5B00,X at SNES $00F401, $02AE73, $02B117, $02B126,
          # $02B2A1, $02B2AA, $02B4FE, $02C27D, $02C28F and $0ABC80.
          for music_cache_pc in 0x07401 0x12E73 0x13117 0x13126 0x132A1 0x132AA 0x134FE 0x1427D 0x1428F 0x53C80; do
            printf '\xBF\x00\x5B\x7F' | dd of=test.sfc bs=1 seek=$((music_cache_pc)) conv=notrunc 2>/dev/null
          done
          # STA.l $7F5B00,X at SNES $02C49A and $02C4AB.
          for music_cache_pc in 0x1449A 0x144AB; do
            printf '\x9F\x00\x5B\x7F' | dd of=test.sfc bs=1 seek=$((music_cache_pc)) conv=notrunc 2>/dev/null
          done
          printf '\xE0\x40\x00' | dd of=test.sfc bs=1 seek=$((0x144A0)) conv=notrunc 2>/dev/null  # $02C4A0 CPX.w #$0040
          printf '\xC0\x60\x00' | dd of=test.sfc bs=1 seek=$((0x144B1)) conv=notrunc 2>/dev/null  # $02C4B1 CPY.w #$0060
          printf '\x8F\x80\x5B\x7F' | dd of=test.sfc bs=1 seek=$((0x144B8)) conv=notrunc 2>/dev/null  # $02C4B8 STA.l $7F5B80 (storm opt-out guard)

          # Run Asar against the synthetic headerless ROM.
          set -o pipefail
          ./asar/asar --no-title-check Oracle_main.asm test.sfc 2>&1 | tee asar_output.txt

          echo "ASM syntax check passed"

  # =============================================================================
  # Lua Script Validation
  # =============================================================================
  # Basic syntax check for Lua test scripts
  lua-check:
    name: Lua Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check Lua Syntax
        run: |
          # Check all Lua scripts for syntax errors
          errors=0
          while IFS= read -r -d '' file; do
            echo "Checking $file..."
            if ! luac5.4 -p "$file" 2>&1; then
              echo "::error file=$file::Syntax error in $file"
              errors=$((errors + 1))
            fi
          done < <(find Scripts/Lua -type f -name '*.lua' -print0)

          if [ $errors -gt 0 ]; then
            echo "::error::Found $errors Lua syntax errors"
            exit 1
          fi

          echo "All Lua scripts passed syntax check"

  # =============================================================================
  # Emulator Tests (Self-Hosted Only)
  # =============================================================================
  # Runs actual ROM tests using Mesen2 testRunner
  # Requires self-hosted runner with:
  # - Mesen2 installed
  # - Base ROM at ~/roms/alttp/oos168.sfc
  emulator-tests:
    name: Emulator Tests
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator_tests
    needs: [asm-check, lua-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Base ROM
        id: check-rom
        run: |
          if [ -f ~/roms/alttp/oos168.sfc ]; then
            echo "rom_available=true" >> "$GITHUB_OUTPUT"
            echo "Base ROM found"
          else
            echo "rom_available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Base ROM not found at ~/roms/alttp/oos168.sfc"
            exit 1
          fi

      - name: Build Patched ROM
        if: steps.check-rom.outputs.rom_available == 'true'
        run: |
          # Copy base ROM to Roms directory
          cp ~/roms/alttp/oos168.sfc Roms/

          # Build patched ROM
          ASAR_BIN="${ASAR_BIN:-asar}" ./Scripts/Build/build_rom.sh 168

      - name: Run Boot Test
        if: steps.check-rom.outputs.rom_available == 'true'
        run: |
          # Run boot verification test
          Mesen --testRunner --timeout=30 \
            Scripts/Lua/verify_boot.lua \
            Roms/oos168x.sfc

          echo "Boot test passed"

      - name: Upload Test Logs
        if: always() && steps.check-rom.outputs.rom_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            *.log
            asar_output.txt
          retention-days: 7

  # =============================================================================
  # Test Summary
  # =============================================================================
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [asm-check, lua-check]
    if: always()

    steps:
      - name: Check Results
        run: |
          echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.asm-check.result }}" == "success" ]; then
            echo "- ASM Syntax: :white_check_mark: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ASM Syntax: :x: Failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.lua-check.result }}" == "success" ]; then
            echo "- Lua Syntax: :white_check_mark: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Lua Syntax: :x: Failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Emulator tests require self-hosted runner with ROM._" >> "$GITHUB_STEP_SUMMARY"
