name: Manifest Generator Tests

on:
  push:
    branches: [master]
  pull_request:
    # Any base branch (stacked PRs). `edited` covers base retargets.
    # No path filter: the tests read Config/, Data/, Docs/, Sprites/ and other
    # inputs from the real repo, and a filtered workflow cannot be a required
    # check. Do not add an `edited`-only job guard: a skipped check counts as
    # passing.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# Only PR runs share a group (one per PR); push and workflow_dispatch runs get
# a unique group (run_id), so a master push never cancels or replaces a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python manifest tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python3 -m pip install Pillow

      - name: Run manifest and source contract tests
        run: >-
          python3 -m unittest discover
          -s Scripts/Generate/tests
          -p 'test_*.py'
          -v

      - name: Run build pipeline tests (mocked assembler and sockets)
        run: >-
          python3 -m unittest discover
          -s Scripts/Build/tests
          -p 'test_*.py'
          -v

      - name: Run validation tool tests
        run: >-
          python3 -m unittest discover
          -s Scripts/Validate/tests
          -p 'test_*.py'
          -v

      - name: Run offline fixture control tests (no emulator)
        run: >-
          python3 -m unittest discover
          -s Tests
          -p 'test_*.py'
          -v
