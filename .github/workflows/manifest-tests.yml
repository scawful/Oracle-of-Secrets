name: Manifest Generator Tests

on:
  push:
    paths:
      - '**/*.asm'
      - 'Data/dialogue/expanded_messages.json'
      - 'Scripts/Build/build_rom.sh'
      - 'Scripts/Generate/**'
      - 'Scripts/Build/**'
      - 'Scripts/Validate/**'
      - 'Tests/**'
      - 'Data/debug/**'
      - 'Oracle-of-Secrets.yaze'
      - '.gitattributes'
      - '.github/workflows/manifest-tests.yml'
  pull_request:
    paths:
      - '**/*.asm'
      - 'Data/dialogue/expanded_messages.json'
      - 'Scripts/Build/build_rom.sh'
      - 'Scripts/Generate/**'
      - 'Scripts/Build/**'
      - 'Scripts/Validate/**'
      - 'Tests/**'
      - 'Data/debug/**'
      - 'Oracle-of-Secrets.yaze'
      - '.gitattributes'
      - '.github/workflows/manifest-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Python manifest tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run manifest and source contract tests
        run: >-
          python3 -m unittest discover
          -s Scripts/Generate/tests
          -p 'test_*.py'
          -v

      - name: Run build pipeline tests (mocked assembler and sockets)
        run: >-
          python3 -m unittest discover
          -s Scripts/Build/tests
          -p 'test_*.py'
          -v

      - name: Run validation tool tests
        run: >-
          python3 -m unittest discover
          -s Scripts/Validate/tests
          -p 'test_*.py'
          -v
