# z3dk_core/config.cc currently reads flat keys, not nested TOML tables.
# Keep analyzer switches in build_rom.sh; they are not z3lsp config keys.
preset = "alttp"
mapper = "lorom"
main = ["Oracle_main.asm"]
symbols = "wla"
# Editor analysis reads this ROM in memory. Build scripts select their own
# explicit input/output and record the exact identities in a build receipt.
rom_path = "Roms/oos168x.sfc"
defines = ["ORACLE=1"]
include_paths = [
  ".",
  "Core",
  "Sprites",
  "Sprites/Bosses",
  "Sprites/Enemies",
  "Sprites/NPCs",
  "Sprites/Objects",
  "Overworld",
  "Dungeons",
  "Dungeons/Collision",
  "Items",
  "Masks",
  "Menu",
  "Music",
  "Util",
  "Data",
]

# Callers own output paths. In particular, a private smoke build must not
# implicitly replace Roms/*.mlb or another build's hooks/diagnostics.
emit = []

# z3lsp consumes these options. The z3asm CLI currently forwards only the
# unused-symbol setting; build_rom.sh invokes the ROM analyzer separately.
warn_unknown_width = true
warn_branch_outside_bank = true
warn_org_collision = true
warn_stack_balance = true
warn_hook_return = true
warn_unauthorized_hook = true
warn_unused_symbols = false

# This linter option guards assembled ROM write blocks, not runtime STA/STZ
# operands. WRAM/SRAM ownership belongs to Config/allocation_ownership.json,
# Core/ram.asm and Core/sram.asm; do not put SRAM "protections" here.
prohibited_memory_ranges = []
